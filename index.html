<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, initial-scale=1.0, user-scalable=no">
    <title>FinancePro - Controle Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-card-hover: #20203a;
            --bg-input: #0f0f1a;
            
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --gradient-danger: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --gradient-card: linear-gradient(145deg, #1e1e35 0%, #16162a 100%);
            
            --primary: #667eea;
            --primary-light: #818cf8;
            --success: #10b981;
            --success-light: #34d399;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #718096;
            
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at top left, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }

        /* Header */
        .app-header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 60%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .user-info h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .datetime-display {
            text-align: right;
            position: relative;
            z-index: 1;
        }

        .current-date {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-light);
            letter-spacing: -0.3px;
            font-family: 'JetBrains Mono', monospace;
        }

        .current-time {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Cards de Resumo */
        .summary-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .summary-card {
            background: var(--gradient-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-hover);
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
        }

        .summary-card.highlight::before {
            background: var(--gradient-success);
        }

        .summary-card .icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .summary-card span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .summary-card .value {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            font-family: 'JetBrains Mono', monospace;
        }

        .summary-card.highlight .value {
            color: var(--success-light);
        }

        /* Formulário */
        .form-card {
            background: var(--gradient-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-md);
        }

        .form-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
            font-weight: 500;
        }

        input:hover {
            border-color: var(--border-hover);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input[type="date"] {
            color-scheme: dark;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-submit {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            letter-spacing: -0.3px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-submit:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Lista */
        .list-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: -8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        .bills-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bill-item {
            background: var(--gradient-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .bill-item:hover {
            transform: translateX(4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .bill-item:active {
            transform: scale(0.98);
        }

        .bill-item.selected {
            border-color: rgba(16, 185, 129, 0.3);
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
        }

        .bill-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            position: relative;
        }

        .bill-item.selected .custom-checkbox {
            border-color: var(--success);
            background: var(--success);
        }

        .custom-checkbox::after {
            content: '';
            width: 8px;
            height: 13px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.3s;
            margin-top: -2px;
        }

        .bill-item.selected .custom-checkbox::after {
            transform: rotate(45deg) scale(1);
        }

        .bill-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bill-name {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            transition: all 0.3s;
        }

        .bill-item.selected .bill-name {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .bill-date-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-light);
            font-family: 'JetBrains Mono', monospace;
        }

        .bill-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bill-date-display {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-light);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.5px;
        }

        .bill-item.selected .bill-date-display {
            color: var(--text-muted);
        }

        .btn-edit {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            border-radius: 6px;
        }

        .btn-edit:hover {
            color: var(--primary-light);
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.1);
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            border-radius: 6px;
            font-weight: 300;
        }

        .btn-delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 48px 20px;
            font-size: 15px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-secondary);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--gradient-success);
            color: #0f172a;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .app-container {
                padding: 16px 12px;
                gap: 16px;
            }
            
            .summary-card .value {
                font-size: 20px;
            }
            
            .bill-date-display {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <div class="header-top">
                <div class="user-profile">
                    <div class="avatar">F</div>
                    <div class="user-info">
                        <h2>FinancePro</h2>
                        <p>Gestão inteligente</p>
                    </div>
                </div>
                <div class="datetime-display">
                    <div class="current-date" id="current-date"></div>
                    <div class="current-time" id="current-time"></div>
                </div>
            </div>
        </div>

        <div class="summary-container">
            <div class="summary-card">
                <div class="icon">📊</div>
                <span>Total de Contas</span>
                <div class="value" id="total-geral">0</div>
            </div>
            <div class="summary-card highlight">
                <div class="icon">✅</div>
                <span>Selecionadas</span>
                <div class="value" id="total-selecionado">0</div>
            </div>
        </div>

        <div class="form-card">
            <div class="form-title">Adicionar Nova Conta</div>
            <input type="hidden" id="bill-id">
            <div class="form-row">
                <div class="input-group" style="flex: 1.5;">
                    <label class="input-label">Nome</label>
                    <input type="text" id="bill-name" placeholder="Ex: Netflix, Luz..." autocomplete="off">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label class="input-label">Vencimento</label>
                    <input type="date" id="bill-date">
                </div>
            </div>
            <button class="btn-submit" id="btn-action" onclick="handleSubmit()">
                <span id="btn-text">+ Adicionar Conta</span>
            </button>
        </div>

        <div class="list-section-title">Contas do Mês</div>
        <ul class="bills-list" id="bills-list">
            </ul>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let db;
        const request = indexedDB.open("FinanceProDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("bills")) {
                db.createObjectStore("bills", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            checkAndRotateDates();
            updateDateTime();
            setInterval(updateDateTime, 1000);
        };

        request.onerror = function() {
            console.error("Erro ao carregar o banco de dados.");
        };

        function updateDateTime() {
            const now = new Date();
            const dateElement = document.getElementById('current-date');
            const timeElement = document.getElementById('current-time');
            
            const options = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
            const dateStr = now.toLocaleDateString('pt-BR', options);
            const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            dateElement.textContent = dateStr;
            timeElement.textContent = timeStr;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function checkAndRotateDates() {
            const transaction = db.transaction(["bills"], "readwrite");
            const objectStore = transaction.objectStore("bills");
            const requestAll = objectStore.getAll();

            requestAll.onsuccess = function() {
                const bills = requestAll.result;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                let billsRotated = 0;
                let databaseUpdated = false;

                bills.forEach((bill) => {
                    const billDate = new Date(bill.date + "T00:00:00");

                    if (billDate < today) {
                        const newDate = new Date(billDate);
                        newDate.setMonth(newDate.getMonth() + 1);
                        
                        const year = newDate.getFullYear();
                        const month = String(newDate.getMonth() + 1).padStart(2, '0');
                        const day = String(newDate.getDate()).padStart(2, '0');
                        
                        bill.date = `${year}-${month}-${day}`;
                        bill.selected = true;
                        
                        objectStore.put(bill);
                        databaseUpdated = true;
                        billsRotated++;
                    }
                });

                transaction.oncomplete = function() {
                    if (billsRotated > 0) {
                        showToast(`🎉 ${billsRotated} conta(s) renovada(s) automaticamente!`);
                    }
                    readAllBills();
                };
            };
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return "";
            const [year, month, day] = dateStr.split("-");
            return `${day}/${month}/${year}`;
        }

        function readAllBills() {
            const transaction = db.transaction(["bills"], "readonly");
            const objectStore = transaction.objectStore("bills");
            const requestAll = objectStore.getAll();

            requestAll.onsuccess = function() {
                renderList(requestAll.result);
            };
        }

        function renderList(bills) {
            const listElement = document.getElementById('bills-list');
            listElement.innerHTML = '';

            if (bills.length === 0) {
                listElement.innerHTML = '<div class="empty-state"><span class="empty-icon">📁</span>Nenhuma conta cadastrada<br>Adicione sua primeira conta acima!</div>';
                document.getElementById('total-geral').textContent = '0';
                document.getElementById('total-selecionado').textContent = '0';
                return;
            }

            let totalGeral = bills.length;
            let totalSelecionado = 0;

            bills.sort((a, b) => new Date(a.date) - new Date(b.date));

            bills.forEach((bill) => {
                if (bill.selected) {
                    totalSelecionado++;
                }

                const li = document.createElement('li');
                li.className = `bill-item ${bill.selected ? 'selected' : ''}`;
                li.setAttribute('onclick', `toggleSelect(${bill.id}, ${bill.selected}, event)`);

                const escapedName = bill.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const escapedDate = bill.date.replace(/'/g, "\\'");

                li.innerHTML = `
                    <div class="bill-left">
                        <div class="custom-checkbox"></div>
                        <div class="bill-details">
                            <span class="bill-name">${escapedName}</span>
                            <span class="bill-date-badge">Vence: ${formatDisplayDate(bill.date)}</span>
                        </div>
                    </div>
                    <div class="bill-right">
                        <button class="btn-edit" onclick="startEdit(${bill.id}, '${escapedName}', '${escapedDate}', event)" title="Editar">
                            ✏️
                        </button>
                        <button class="btn-delete" onclick="deleteBill(${bill.id}, event)" title="Excluir">
                            ×
                        </button>
                    </div>
                `;

                listElement.appendChild(li);
            });

            document.getElementById('total-geral').textContent = totalGeral;
            document.getElementById('total-selecionado').textContent = totalSelecionado;
        }

        function handleSubmit() {
            const idInput = document.getElementById('bill-id').value;
            const nameInput = document.getElementById('bill-name');
            const dateInput = document.getElementById('bill-date');

            const name = nameInput.value.trim();
            const date = dateInput.value;

            if (!name || !date) {
                showToast('⚠️ Preencha todos os campos!');
                return;
            }

            const transaction = db.transaction(["bills"], "readwrite");
            const objectStore = transaction.objectStore("bills");

            if (idInput) {
                const id = parseInt(idInput);
                const getReq = objectStore.get(id);
                
                getReq.onsuccess = function() {
                    const data = getReq.result;
                    if (data) {
                        data.name = name;
                        data.date = date;
                        // Preserva o estado de seleção
                        objectStore.put(data);
                    }
                };
                
                getReq.onerror = function() {
                    console.error("Erro ao buscar registro para edição");
                };
            } else {
                objectStore.add({ name, date, selected: true });
            }

            transaction.oncomplete = function() {
                document.getElementById('bill-id').value = '';
                nameInput.value = '';
                dateInput.value = '';
                document.getElementById('btn-text').textContent = '+ Adicionar Conta';
                document.getElementById('btn-action').style.background = 'var(--gradient-primary)';
                document.activeElement.blur();
                readAllBills();
                
                if (idInput) {
                    showToast('✅ Conta atualizada com sucesso!');
                } else {
                    showToast('✅ Conta adicionada com sucesso!');
                }
            };
        }

        function toggleSelect(id, currentStatus, event) {
            if (event.target.closest('.btn-delete') || event.target.closest('.btn-edit')) return;

            const transaction = db.transaction(["bills"], "readwrite");
            const objectStore = transaction.objectStore("bills");
            const requestGet = objectStore.get(id);

            requestGet.onsuccess = function() {
                const data = requestGet.result;
                if (data) {
                    data.selected = !currentStatus;
                    objectStore.put(data);
                }
            };

            transaction.oncomplete = function() {
                readAllBills();
            };
        }

        function startEdit(id, name, date, event) {
            event.stopPropagation();
            
            document.getElementById('bill-id').value = id;
            document.getElementById('bill-name').value = name;
            document.getElementById('bill-date').value = date;
            
            const btnText = document.getElementById('btn-text');
            btnText.textContent = '💾 Salvar Alterações';
            document.getElementById('btn-action').style.background = 'var(--gradient-success)';
            
            document.getElementById('bill-name').focus();
            document.getElementById('bill-name').select();
            
            // Scroll suave até o formulário
            document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function deleteBill(id, event) {
            event.stopPropagation();
            
            if (confirm('Deseja realmente excluir esta conta?')) {
                const transaction = db.transaction(["bills"], "readwrite");
                const objectStore = transaction.objectStore("bills");
                objectStore.delete(id);

                transaction.oncomplete = function() {
                    readAllBills();
                    showToast('🗑️ Conta excluída com sucesso!');
                };
            }
        }

        // Event Listeners
        document.getElementById('bill-date').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                handleSubmit();
            }
        });

        document.getElementById('bill-name').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('bill-date').focus();
            }
        });

        // Prevenir comportamento padrão de submit
        document.addEventListener('submit', function(event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
